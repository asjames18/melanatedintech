name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Bun is what this project develops against. bun.lock is the maintained
      # lockfile and bunfig.toml carries a deliberate 24h minimumReleaseAge
      # supply-chain guard that npm ignores entirely.
      #
      # CI previously ran `npm ci` against package-lock.json. Neither lockfile
      # listed @capacitor/core, which package.json declares, so install failed in
      # ~14s on every run from 2026-08-21 onward and no commit was ever actually
      # linted, typechecked or built. That is how 347 type errors and a runtime
      # break both reached production.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # scripts/build.mjs and scripts/smoke.mjs shell out to node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

      # The check that matters most, and the one that did not exist.
      #
      # lint + typecheck + build all passed for two separate changes that took
      # the site down: a renamed TanStack builder method (every route 500'd) and
      # a client bundle missing its public config (auth and checkout dead while
      # SSR looked fine). A built bundle is not a running one. This starts the
      # Worker and fetches real pages. It needs no secrets.
      - run: bun run smoke

      # Advisory, and last on purpose.
      #
      # 17 advisories are open (1 critical: seroval, reached via TanStack Start's
      # SSR serialization), almost all transitive and not directly upgradable
      # from this package.json. Gating on them means nothing above ever runs — a
      # gate that blocks on what you cannot fix today stops protecting you from
      # what you can. Re-tighten to blocking once the backlog is triaged.
      - name: Dependency audit (advisory)
        run: bun audit --audit-level=high
        continue-on-error: true
